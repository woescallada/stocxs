name: Crear EXE Sniper

on:
  workflow_dispatch: # Esto permite que le des a un botón para generar el exe cuando quieras
  push:
    branches: [ "main" ] # También se genera si subes cambios al código

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Descargar código
      uses: actions/checkout@v3

    - name: 🐍 Instalar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔨 Crear Ejecutable (.exe)
      # --collect-all customtkinter es VITAL para que se vea bien el diseño
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter --name "SniperApp" main.py

    - name: 📤 Subir el EXE para descargar
      uses: actions/upload-artifact@v4
      with:
        name: SniperApp-Windows
        path: dist/SniperApp.exe
